<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maze Quest</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-color: #1e293b;
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            padding: 20px;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.3s ease;
        }

        .hidden {
            display: none !important;
            opacity: 0;
        }

        /* Home Screen */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .menu-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
            margin-bottom: 40px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 340px;
        }

        .level-btn {
            background-color: var(--panel-color);
            border: 2px solid #334155;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .level-btn.full-width {
            grid-column: span 2;
        }

        /* Game Screen */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }

        #level-title {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .back-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1rem;
            cursor: pointer;
        }

        #canvas-container {
            background-color: var(--panel-color);
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 50vh;
            border-radius: 8px;
        }

        /* Mobile Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 180px;
            height: 180px;
            margin-top: 25px;
        }

        .ctrl-btn {
            background-color: var(--panel-color);
            border: 2px solid #334155;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .ctrl-btn:active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }

        svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Icons Pack */
        .icon { width: 32px; height: 32px; }
        .easy-ico { color: #4ade80; }
        .normal-ico { color: #60a5fa; }
        .hard-ico { color: #facc15; }
        .harder-ico { color: #f97316; }
        .insane-ico { color: #ef4444; }
        .vinsane-ico { color: #a855f7; }
        .demon-ico { color: #ec4899; }
    </style>
</head>
<body>

    <!-- SVG Icon Templates -->
    <svg style="display: none;">

        <g id="ico-normal"><rect x="6" y="6" width="20" height="20" rx="4" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 16h8" stroke="currentColor" stroke-width="2"/></g>
        <g id="ico-hard"><polygon points="16,4 28,26 4,26" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="16" cy="18" r="2" fill="currentColor"/></g>
        <g id="ico-harder"><path d="M16 2 L28 14 L16 26 L4 14 Z" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 14h8" stroke="currentColor" stroke-width="2"/></g>
        <g id="ico-insane"><path d="M16 3 L26 10 L22 26 L10 26 L6 10 Z" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 15l4 4 4-4" stroke="currentColor" stroke-width="2" fill="none"/></g>
        <g id="ico-vinsane"><circle cx="16" cy="16" r="11" stroke="currentColor" stroke-width="2" fill="none"/><path d="M10 12 L14 22 L18 22 L22 12" stroke="currentColor" stroke-width="2" fill="none"/></g>
        <g id="ico-demon"><path d="M6 8 L10 6 L12 12 M26 8 L22 6 L20 12 M8 18 Q16 26 24 18 Q16 22 8 18" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="11" cy="14" r="1.5" fill="currentColor"/><circle cx="21" cy="14" r="1.5" fill="currentColor"/></g>
        <g id="arr-up"><path d="M12 4l-8 8h6v8h4v-8h6z"/></g>
        <g id="arr-down"><path d="M12 20l8-8h-6v-8h-4v8h-6z"/></g>
        <g id="arr-left"><path d="M4 12l8 8v-6h8v-4h-8v-6z"/></g>
        <g id="arr-right"><path d="M20 12l-8-8v6h-8v4h8v6z"/></g>
    </svg>

    <!-- Home Screen -->
    <div id="home-screen" class="screen">
        <h1>Maze Quest</h1>
        <p class="subtitle">Find your way out</p>
        
        <button class="menu-btn" onclick="startFastest()">Quick Play</button>

        <div class="level-grid">
            <button class="level-btn" onclick="loadLevel(0)">
                <svg class="icon easy-ico"><use href="#ico-easy"/></svg>
                Easy
            </button>
            <button class="level-btn" onclick="loadLevel(1)">
                <svg class="icon normal-ico"><use href="#ico-normal"/></svg>
                Normal
            </button>
            <button class="level-btn" onclick="loadLevel(2)">
                <svg class="icon hard-ico"><use href="#ico-hard"/></svg>
                Hard
            </button>
            <button class="level-btn" onclick="loadLevel(3)">
                <svg class="icon harder-ico"><use href="#ico-harder"/></svg>
                Harder
            </button>
            <button class="level-btn" onclick="loadLevel(4)">
                <svg class="icon insane-ico"><use href="#ico-insane"/></svg>
                Insane
            </button>
            <button class="level-btn" onclick="loadLevel(5)">
                <svg class="icon vinsane-ico"><use href="#ico-vinsane"/></svg>
                Very Insane
            </button>
            <button class="level-btn full-width" onclick="loadLevel(6)">
                <svg class="icon demon-ico"><use href="#ico-demon"/></svg>
                Demon
            </button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
        <div class="game-header">
            <button class="back-btn" onclick="showHome()">← Menu</button>
            <div id="level-title">Level</div>
            <div style="width: 50px;"></div>
        </div>

        <div id="canvas-container">
            <canvas id="mazeCanvas"></canvas>
        </div>

        <!-- D-Pad Controls -->
        <div class="controls">
            <div id="btn-up" class="ctrl-btn"><svg viewBox="0 0 24 24"><use href="#arr-up"/></svg></div>
            <div id="btn-left" class="ctrl-btn"><svg viewBox="0 0 24 24"><use href="#arr-left"/></svg></div>
            <div id="btn-right" class="ctrl-btn"><svg viewBox="0 0 24 24"><use href="#arr-right"/></svg></div>
            <div id="btn-down" class="ctrl-btn"><svg viewBox="0 0 24 24"><use href="#arr-down"/></svg></div>
        </div>
    </div>

            { name: "Demon", size: 39, color: "#ec4899" }
        ];
